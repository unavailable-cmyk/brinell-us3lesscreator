# Compile/link Windows x64 libraries while leaving target execution to the
# separate integration test. Meson supports this through its cross-build model.
[binaries]
c = 'cl'
cpp = 'cl'
ar = 'lib'

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
needs_exe_wrapper = true
